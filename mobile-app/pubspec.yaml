name: capellan_led_mobile
description: Capellán LED - Mobile Control App for LED Flow Props
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.0.0
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # HTTP & Networking
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # USB Serial
  usb_serial: ^0.3.2
  flutter_libserialport: ^0.2.8
  
  # WiFi
  connectivity_plus: ^5.0.0
  wifi_scan: ^0.4.0
  
  # Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  
  # Audio
  just_audio: ^0.9.35
  
  # 3D Visualization
  three_js_wrapper: ^0.2.0
  model_viewer: ^3.0.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.0.0
  json_serializable: ^6.7.0
  dio: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
