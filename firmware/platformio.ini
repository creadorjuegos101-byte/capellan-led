; PlatformIO Project Configuration File for Capellán LED
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp8266-d1
description = Capellán LED - LED Flow Props Controller

[common]
build_flags =
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -DFLASH_SPIFFS=1
    -DNO_GLOBAL_TWOWIRE
lib_deps =
    ArduinoJSON
    WebSockets
    FastLED

monitor_speed = 115200
upload_speed = 921600

; ========= ESP8266 D1 ==========
[env:esp8266-d1]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_port = COM3
upload_port = COM3

build_flags =
    ${common.build_flags}
    -DBOARD_ESP8266_D1
    -DLED_PIN=5
    -DNUM_LEDS=30

lib_deps =
    ${common.lib_deps}
    ESP8266WiFi
    SPIFFS

; ========= ESP32 C3 ==========
[env:esp32-c3]
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_port = COM3
upload_port = COM3

build_flags =
    ${common.build_flags}
    -DBOARD_ESP32_C3
    -DLED_PIN=8
    -DNUM_LEDS=30

lib_deps =
    ${common.lib_deps}
    WiFi
    SPIFFS

; ========= ESP32 WROOM-32 ==========
[env:esp32-wroom]
platform = espressif32@6.4.0
board = esp32doit-devkit-v1
framework = arduino
monitor_port = COM3
upload_port = COM3

build_flags =
    ${common.build_flags}
    -DBOARD_ESP32_WROOM
    -DLED_PIN=12
    -DNUM_LEDS=30

lib_deps =
    ${common.lib_deps}
    WiFi
    SPIFFS

; ========= Testing ==========
[env:test]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino

test_framework = unity
test_ignore = tests/integration
